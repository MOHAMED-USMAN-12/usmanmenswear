<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coupons & Discounts | Usman Mens Wear Admin</title>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👔</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-sidebar-brand">
      <i class="bi bi-shield-check text-accent"></i>
      <div>USMAN <span>ADMIN</span></div>
    </div>
    <ul class="admin-nav-menu">
      <li class="admin-nav-item"><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li class="admin-nav-item"><a href="products.html"><i class="bi bi-tags"></i> Products</a></li>
      <li class="admin-nav-item"><a href="add-product.html"><i class="bi bi-plus-square"></i> Add Product</a></li>
      <li class="admin-nav-item"><a href="orders.html"><i class="bi bi-box-seam"></i> Orders</a></li>
      <li class="admin-nav-item"><a href="customers.html"><i class="bi bi-people"></i> Customers</a></li>
      <li class="admin-nav-item"><a href="inventory.html"><i class="bi bi-archive"></i> Inventory</a></li>
      <li class="admin-nav-item active"><a href="coupons.html"><i class="bi bi-ticket-perforated"></i> Coupons</a></li>
    </ul>
    <div class="admin-sidebar-footer">
      <a href="../index.html" class="text-white small" target="_blank"><i class="bi bi-box-arrow-up-right me-1 text-accent"></i> View Store</a>
      <a href="#" id="adminLogoutBtn" class="text-danger small"><i class="bi bi-power"></i> Logout</a>
    </div>
  </aside>

  <div class="admin-main-wrapper">
    <header class="admin-top-nav">
      <button class="btn btn-sm btn-outline-dark d-lg-none" id="btnToggleSidebar"><i class="bi bi-list fs-5"></i></button>
      <h5 class="mb-0 fw-bold">Promotional Vouchers &amp; Coupon Codes</h5>
    </header>

    <main class="admin-content">
      <div class="row g-4">
        
        <!-- Create Coupon Form -->
        <div class="col-lg-4">
          <div class="admin-card">
            <div class="admin-card-header">
              <h5>Create Promo Code</h5>
            </div>
            <div class="p-4">
              <form id="adminCouponForm">
                <div class="mb-3">
                  <label class="form-label small fw-bold text-uppercase">Coupon Code *</label>
                  <input type="text" class="form-control" id="couponCode" placeholder="e.g. FESTIVE20" required style="text-transform: uppercase;">
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold text-uppercase">Discount Type *</label>
                  <select class="form-select" id="couponType">
                    <option value="percent">Percentage Discount (%)</option>
                    <option value="fixed">Flat Amount Discount (₹)</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold text-uppercase">Discount Value *</label>
                  <input type="number" class="form-control" id="couponValue" min="1" placeholder="10 (for 10%) or 200 (for ₹200)" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold text-uppercase">Minimum Order Value (₹)</label>
                  <input type="number" class="form-control" id="couponMinOrder" min="0" placeholder="999" value="999">
                </div>
                <div class="mb-4">
                  <label class="form-label small fw-bold text-uppercase">Description</label>
                  <input type="text" class="form-control" id="couponDesc" placeholder="e.g. 10% off for new season">
                </div>
                <button type="submit" class="btn btn-luxury-primary w-100 py-2 fw-bold">
                  Create Coupon Code
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- Coupons Table -->
        <div class="col-lg-8">
          <div class="admin-card">
            <div class="admin-card-header">
              <h5>Active Coupon Codes</h5>
            </div>
            <div class="table-responsive">
              <table class="table admin-table align-middle">
                <thead>
                  <tr>
                    <th>Code</th>
                    <th>Benefit</th>
                    <th>Min Order</th>
                    <th>Rules</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="adminCouponsTableBody">
                  <!-- Rendered dynamically via AdminController.renderCouponsTable() -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/admin.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const admin = AuthManager.requireAdmin();
      if (!admin) return;

      AdminController.initCouponsPage();
    });
  </script>
</body>
</html>
