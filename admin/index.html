<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Usman Mens Wear</title>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👔</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="d-flex align-items-center justify-content-center bg-dark" style="min-height: 100vh;">

  <div class="card p-4 p-sm-5 border-0 shadow-lg rounded-3" style="max-width: 440px; width: 100%; background: #FFFFFF;">
    <div class="text-center mb-4">
      <div class="brand-gold fs-1"><i class="bi bi-shield-lock-fill text-accent"></i></div>
      <h3 class="font-serif mt-2 mb-1">Administrative Portal</h3>
      <span class="text-muted small">Usman Mens Wear &bull; Internal Control System</span>
    </div>

    <!-- Quick Auto-Fill -->
    <div class="alert alert-light border p-2 text-center small mb-3">
      Default Credentials: <strong>admin@usmanwear.com</strong> / <strong>admin123</strong>
      <button type="button" class="btn btn-sm btn-outline-dark w-100 mt-2" id="btnAdminAutofill">
        Fill Admin Credentials
      </button>
    </div>

    <form id="adminLoginForm">
      <div class="mb-3">
        <label class="form-label small fw-bold text-uppercase">Admin Email</label>
        <input type="email" class="form-control" id="adminEmail" required placeholder="admin@usmanwear.com">
      </div>

      <div class="mb-4">
        <label class="form-label small fw-bold text-uppercase">Password</label>
        <input type="password" class="form-control" id="adminPassword" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-luxury-primary w-100 py-3 fw-bold">
        Authenticate &amp; Enter &rarr;
      </button>

      <div class="text-center mt-3">
        <a href="../index.html" class="small text-muted">&larr; Return to Storefront</a>
      </div>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/auth.js"></script>

  <script>
    document.getElementById('btnAdminAutofill').addEventListener('click', () => {
      document.getElementById('adminEmail').value = 'admin@usmanwear.com';
      document.getElementById('adminPassword').value = 'admin123';
    });

    document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const pass = document.getElementById('adminPassword').value;

      const res = AuthManager.login(email, pass);
      if (res.success && res.user.role === 'admin') {
        showToast("Admin authenticated.", "success");
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 600);
      } else {
        showToast("Access denied. Admin privileges required.", "danger");
      }
    });
  </script>
</body>
</html>
