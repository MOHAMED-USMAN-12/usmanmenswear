<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Directory | Usman Mens Wear Admin</title>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👔</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-sidebar-brand">
      <i class="bi bi-shield-check text-accent"></i>
      <div>USMAN <span>ADMIN</span></div>
    </div>
    <ul class="admin-nav-menu">
      <li class="admin-nav-item"><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li class="admin-nav-item"><a href="products.html"><i class="bi bi-tags"></i> Products</a></li>
      <li class="admin-nav-item"><a href="add-product.html"><i class="bi bi-plus-square"></i> Add Product</a></li>
      <li class="admin-nav-item"><a href="orders.html"><i class="bi bi-box-seam"></i> Orders</a></li>
      <li class="admin-nav-item active"><a href="customers.html"><i class="bi bi-people"></i> Customers</a></li>
      <li class="admin-nav-item"><a href="inventory.html"><i class="bi bi-archive"></i> Inventory</a></li>
      <li class="admin-nav-item"><a href="coupons.html"><i class="bi bi-ticket-perforated"></i> Coupons</a></li>
    </ul>
    <div class="admin-sidebar-footer">
      <a href="../index.html" class="text-white small" target="_blank"><i class="bi bi-box-arrow-up-right me-1 text-accent"></i> View Store</a>
      <a href="#" id="adminLogoutBtn" class="text-danger small"><i class="bi bi-power"></i> Logout</a>
    </div>
  </aside>

  <div class="admin-main-wrapper">
    <header class="admin-top-nav">
      <button class="btn btn-sm btn-outline-dark d-lg-none" id="btnToggleSidebar"><i class="bi bi-list fs-5"></i></button>
      <h5 class="mb-0 fw-bold">Client Directory &amp; Lifetime Metrics</h5>
    </header>

    <main class="admin-content">
      <div class="admin-card">
        <div class="p-3 border-bottom">
          <h5 class="mb-0">Registered Clients</h5>
        </div>

        <div class="table-responsive">
          <table class="table admin-table align-middle">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Contact</th>
                <th>Registered</th>
                <th>Orders Placed</th>
                <th>Lifetime Value</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="adminCustomersTableBody">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/checkout.js"></script>
  <script src="../assets/js/admin.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const admin = AuthManager.requireAdmin();
      if (!admin) return;

      const users = AuthManager.getAllUsers().filter(u => u.role !== 'admin');
      const orders = OrderStore.getAll();
      const tbody = document.getElementById('adminCustomersTableBody');

      tbody.innerHTML = users.map(u => {
        const userOrders = orders.filter(o => o.userId === u.id);
        const ltv = userOrders.reduce((sum, o) => sum + (o.calculations?.total || 0), 0);
        return `
          <tr>
            <td>
              <div class="d-flex align-items-center gap-3">
                <div class="avatar-circle" style="background: #C6A15B; color: #FFF;">${u.name.charAt(0)}</div>
                <div>
                  <strong>${u.name}</strong>
                  <div class="small text-muted">ID: ${u.id}</div>
                </div>
              </div>
            </td>
            <td>
              <div>${u.email}</div>
              <small class="text-muted">+91 ${u.phone}</small>
            </td>
            <td>${u.joinedDate || '2026-01-15'}</td>
            <td><span class="badge bg-light text-dark border">${userOrders.length} orders</span></td>
            <td class="fw-bold">${formatCurrency(ltv)}</td>
            <td><span class="badge bg-success">Active Member</span></td>
          </tr>
        `;
      }).join('');
    });
  </script>
</body>
</html>
