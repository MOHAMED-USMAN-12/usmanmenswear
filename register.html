<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Usman Mens Wear</title>
  <meta name="description" content="Register an account for personalized luxury shopping, order tracking, and exclusive previews.">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👔</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-light">

  <header class="bg-white border-bottom py-3">
    <div class="container text-center">
      <a class="navbar-brand-logo justify-content-center" href="index.html">
        <div>
          USMAN <span class="brand-gold">MENS WEAR</span>
          <span class="brand-subtitle">HAUTE SARTORIAL</span>
        </div>
      </a>
    </div>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
          <div class="card p-4 p-sm-5 border-0 shadow-sm rounded-3">
            <h3 class="mb-1 text-center font-serif">Create Your Account</h3>
            <p class="text-muted small text-center mb-4">Join our private clientele for sartorial privileges</p>

            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label small fw-bold text-uppercase">Full Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="regName" placeholder="e.g. Usman Khan" required>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold text-uppercase">Email Address <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="regEmail" placeholder="usman@example.com" required>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold text-uppercase">10-Digit Mobile Number <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted small">+91</span>
                  <input type="tel" class="form-control" id="regPhone" placeholder="9876543210" maxlength="10" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold text-uppercase">Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control" id="regPassword" placeholder="Minimum 6 characters" minlength="6" required>
              </div>

              <div class="mb-4">
                <label class="form-label small fw-bold text-uppercase">Confirm Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control" id="regConfirmPassword" placeholder="Repeat your password" minlength="6" required>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                <label class="form-check-label small text-muted" for="termsCheck">
                  I agree to the <a href="privacy-policy.html" class="text-dark fw-bold">Privacy Policy</a> &amp; <a href="return-policy.html" class="text-dark fw-bold">Terms of Service</a>
                </label>
              </div>

              <button type="submit" class="btn btn-luxury-primary w-100 py-3 mb-3 fw-bold">
                Create Account <i class="bi bi-person-check ms-1"></i>
              </button>

              <div class="text-center small text-muted">
                Already registered? <a href="login.html" class="fw-bold text-accent">Sign In</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const pass = document.getElementById('regPassword').value;
      const cpass = document.getElementById('regConfirmPassword').value;

      if (pass !== cpass) {
        showToast("Passwords do not match.", "danger");
        return;
      }

      if (!/^\d{10}$/.test(phone)) {
        showToast("Please enter a valid 10-digit mobile number.", "danger");
        return;
      }

      const res = AuthManager.register(name, email, phone, pass);
      if (res.success) {
        showToast("Account created successfully! Welcome to Usman Mens Wear.", "success");
        setTimeout(() => {
          window.location.href = 'my-account.html';
        }, 900);
      } else {
        showToast(res.message, "danger");
      }
    });
  </script>
</body>
</html>
