<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products | Usman Mens Wear Admin</title>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👔</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-sidebar-brand">
      <i class="bi bi-shield-check text-accent"></i>
      <div>USMAN <span>ADMIN</span></div>
    </div>

    <ul class="admin-nav-menu">
      <li class="admin-nav-item"><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li class="admin-nav-item active"><a href="products.html"><i class="bi bi-tags"></i> Products</a></li>
      <li class="admin-nav-item"><a href="add-product.html"><i class="bi bi-plus-square"></i> Add Product</a></li>
      <li class="admin-nav-item"><a href="orders.html"><i class="bi bi-box-seam"></i> Orders</a></li>
      <li class="admin-nav-item"><a href="customers.html"><i class="bi bi-people"></i> Customers</a></li>
      <li class="admin-nav-item"><a href="inventory.html"><i class="bi bi-archive"></i> Inventory</a></li>
      <li class="admin-nav-item"><a href="coupons.html"><i class="bi bi-ticket-perforated"></i> Coupons</a></li>
    </ul>

    <div class="admin-sidebar-footer">
      <a href="../index.html" class="text-white small" target="_blank"><i class="bi bi-box-arrow-up-right me-1 text-accent"></i> View Store</a>
      <a href="#" id="adminLogoutBtn" class="text-danger small"><i class="bi bi-power"></i> Logout</a>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="admin-main-wrapper">
    
    <header class="admin-top-nav">
      <button class="btn btn-sm btn-outline-dark d-lg-none" id="btnToggleSidebar">
        <i class="bi bi-list fs-5"></i>
      </button>
      <h5 class="mb-0 fw-bold">Product Catalog Management</h5>
      <a href="add-product.html" class="btn btn-luxury-primary btn-sm">
        <i class="bi bi-plus-lg"></i> Add New Product
      </a>
    </header>

    <main class="admin-content">
      
      <div class="admin-card">
        <!-- Search and Filter Bar -->
        <div class="p-3 border-bottom d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div class="d-flex gap-2 flex-grow-1" style="max-width: 480px;">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control" id="adminProductSearch" placeholder="Search product name or SKU...">
            </div>
            <select class="form-select form-select-sm" id="adminCategoryFilter" style="max-width: 180px;">
              <option value="">All Categories</option>
              <option value="formal-shirts">Formal Shirts</option>
              <option value="casual-shirts">Casual Shirts</option>
              <option value="polo-tshirts">Polo T-Shirts</option>
              <option value="printed-tshirts">Printed T-Shirts</option>
              <option value="jeans">Jeans</option>
              <option value="formal-trousers">Formal Trousers</option>
              <option value="trousers">Casual Trousers</option>
              <option value="accessories">Accessories</option>
            </select>
          </div>
        </div>

        <!-- Products Table -->
        <div class="table-responsive">
          <table class="table admin-table align-middle">
            <thead>
              <tr>
                <th>Product</th>
                <th>SKU</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="adminProductsTableBody">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/checkout.js"></script>
  <script src="../assets/js/admin.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const admin = AuthManager.requireAdmin();
      if (!admin) return;

      AdminController.initProductsPage();

      const toggleBtn = document.getElementById('btnToggleSidebar');
      const sidebar = document.getElementById('adminSidebar');
      if (toggleBtn && sidebar) {
        toggleBtn.addEventListener('click', () => sidebar.classList.toggle('show'));
      }

      document.getElementById('adminLogoutBtn').addEventListener('click', (e) => {
        e.preventDefault();
        AuthManager.logout();
      });
    });
  </script>
</body>
</html>
