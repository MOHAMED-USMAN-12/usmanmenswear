<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Usman Mens Wear</title>
  <meta name="description" content="Sign in to your Usman Mens Wear account to view orders and saved addresses.">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👔</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-light">

  <!-- Header Minimal -->
  <header class="bg-white border-bottom py-3">
    <div class="container text-center">
      <a class="navbar-brand-logo justify-content-center" href="index.html">
        <div>
          USMAN <span class="brand-gold">MENS WEAR</span>
          <span class="brand-subtitle">HAUTE SARTORIAL</span>
        </div>
      </a>
    </div>
  </header>

  <!-- Login Main -->
  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card p-4 p-sm-5 border-0 shadow-sm rounded-3">
            <h3 class="mb-1 text-center font-serif">Welcome Back</h3>
            <p class="text-muted small text-center mb-4">Sign in to your Usman Mens Wear account</p>

            <!-- Quick Demo Login Pill -->
            <div class="alert alert-light border p-3 small mb-4">
              <strong class="d-block mb-1 text-dark"><i class="bi bi-person-badge text-accent"></i> Quick Demo Access:</strong>
              <div class="d-flex gap-2 mt-2">
                <button type="button" class="btn btn-sm btn-outline-dark flex-grow-1" id="btnFillCustomerDemo">
                  Customer Demo
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary flex-grow-1" id="btnFillAdminDemo">
                  Admin Demo
                </button>
              </div>
            </div>

            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label small fw-bold text-uppercase">Email or Mobile Number</label>
                <input type="text" class="form-control" id="loginIdentifier" placeholder="user@usmanwear.com or 9876543210" required>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between">
                  <label class="form-label small fw-bold text-uppercase">Password</label>
                  <a href="#" class="small text-muted" onclick="alert('Demo Mode: Default password is user123 or admin123'); return false;">Forgot?</a>
                </div>
                <div class="input-group">
                  <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                  <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label small text-muted" for="rememberMe">
                  Remember my session
                </label>
              </div>

              <button type="submit" class="btn btn-luxury-primary w-100 py-3 mb-3 fw-bold">
                Sign In <i class="bi bi-arrow-right"></i>
              </button>

              <div class="text-center small text-muted">
                Don't have an account yet? <a href="register.html" class="fw-bold text-accent">Create an Account</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Demo buttons
      document.getElementById('btnFillCustomerDemo').addEventListener('click', () => {
        document.getElementById('loginIdentifier').value = 'user@usmanwear.com';
        document.getElementById('loginPassword').value = 'user123';
      });

      document.getElementById('btnFillAdminDemo').addEventListener('click', () => {
        document.getElementById('loginIdentifier').value = 'admin@usmanwear.com';
        document.getElementById('loginPassword').value = 'admin123';
      });

      // Password toggle
      document.getElementById('togglePasswordBtn').addEventListener('click', function() {
        const input = document.getElementById('loginPassword');
        const icon = this.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'bi bi-eye-slash';
        } else {
          input.type = 'password';
          icon.className = 'bi bi-eye';
        }
      });

      // Form submission
      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('loginIdentifier').value;
        const pass = document.getElementById('loginPassword').value;

        const res = AuthManager.login(id, pass);
        if (res.success) {
          showToast(`Welcome back, ${res.user.name}!`, "success");
          setTimeout(() => {
            if (res.user.role === 'admin') {
              window.location.href = 'admin/dashboard.html';
            } else {
              const params = new URLSearchParams(window.location.search);
              const returnUrl = params.get('returnUrl');
              window.location.href = returnUrl ? decodeURIComponent(returnUrl) : 'my-account.html';
            }
          }, 800);
        } else {
          showToast(res.message, "danger");
        }
      });
    });
  </script>
</body>
</html>
